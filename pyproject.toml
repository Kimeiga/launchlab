[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launchlab-research"
version = "0.2.0"
description = "Read-only, evidence-first Solana token signal research"
requires-python = ">=3.10"
authors = [{name = "LaunchLab"}]
dependencies = []

[project.scripts]
launchlab = "launchlab.cli:main"

[tool.setuptools.packages.find]
include = ["launchlab*"]
